<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>종료 UI 조립 예시</title><style>html,body{margin:0;background:#0b1020;color:#edd5a7;font-family:'Malgun Gothic',sans-serif}#stage{width:1672px;height:941px;position:relative;transform-origin:top left;background:radial-gradient(ellipse at 85% 45%,#503a24 0,transparent 45%),linear-gradient(120deg,#0a1121,#222d44)}.asset{position:absolute;object-fit:contain;pointer-events:none}.logo{position:absolute;left:90px;top:190px;font-size:64px;letter-spacing:8px}.menu{position:absolute;left:145px;font-size:26px;color:#948b80}.menu.active{color:#efca80}h2{position:absolute;left:530px;width:620px;text-align:center;margin:0;font-size:32px;color:#e7c383}p{position:absolute;left:550px;width:570px;text-align:center;font-size:20px;margin:0;color:#382b22}.save-row{position:absolute;left:615px;width:480px;display:flex;align-items:center;justify-content:space-between;color:#33261e;font-size:20px}.save-row b{font-weight:500}.action{position:absolute;border:0;background:none;color:#f4dbab;font-size:22px;cursor:pointer}.action:hover{background:url('png/button_hover.png') center/contain no-repeat}.action:active{filter:brightness(.8);transform:scale(.98)}.action:focus-visible{outline:2px solid #ffe3a0}.tabs{position:absolute;left:550px;top:390px;display:flex}.tabs button{width:190px;height:65px;background:none;border:none;color:#f3d7a6;font-size:23px;cursor:pointer}.audio-row{position:absolute;left:550px;display:flex;align-items:center;gap:25px;height:45px;font-size:23px}.audio-row span{width:130px}.audio-row input{appearance:none;width:320px;height:28px;background:url('png/slider_track.png') center/100% 100%;outline:none}.audio-row input::-webkit-slider-thumb{appearance:none;width:45px;height:45px;background:url('png/slider_knob.png') center/contain no-repeat}.audio-row input::-moz-range-thumb{width:45px;height:45px;border:none;background:url('png/slider_knob.png') center/contain no-repeat}.audio-row output{width:60px}.option{position:absolute;left:565px;width:540px;display:flex;align-items:center;justify-content:space-between;font-size:23px}.option select,.key{padding:10px 20px;background:#151d33;color:#efd5a4;border:1px solid #c39650;border-radius:8px;font-size:20px}.option input{accent-color:#d6a65a;width:280px}#status{position:absolute;bottom:20px;left:520px;color:#ccbda4;font-size:18px}.note{position:absolute;left:1240px;top:650px;width:310px;color:#b9a98b;font-size:17px}</style><div id="stage"><div class="logo">악몽 수선소</div><div class="menu " style="top:410px">이어하기</div><div class="menu " style="top:476px">새로하기</div><div class="menu " style="top:542px">설정</div><div class="menu active" style="top:608px">종료</div><img class="asset " src="png/panel_confirm.png" style="left:520px;top:355px;width:630px;height:425px"><img class="asset " src="png/row_divider.png" style="left:685px;top:482px;width:300px;height:14px"><img class="asset " src="png/button_normal.png" style="left:580px;top:620px;width:240px;height:90px"><img class="asset " src="png/button_normal.png" style="left:855px;top:620px;width:240px;height:90px"><img class="asset " src="png/menu_marker.png" style="left:95px;top:612px;width:30px;height:30px"><img class="asset " src="png/menu_underline.png" style="left:110px;top:645px;width:265px;height:24px"><h2 style="top:415px">종료</h2><p style="top:525px;color:#ecd6ad">게임을 종료할까요?</p><button class="action" style="left:580px;top:620px;width:240px;height:90px" onclick="document.getElementById('status').textContent='종료 버튼 선택 예시'">종료</button><button class="action" style="left:855px;top:620px;width:240px;height:90px" onclick="document.getElementById('status').textContent='돌아가기 버튼 선택 예시'">돌아가기</button><div class="note">리소스 조립 예시<br>기존 수선소 배경은 게임에서 연결<br>문자와 숫자는 별도 UI 텍스트</div><div id="status"></div></div><script>function fit(){document.getElementById('stage').style.transform='scale('+Math.min(innerWidth/1672,innerHeight/941)+')'}addEventListener('resize',fit);fit();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabcontent').forEach(e=>e.hidden=e.id!==b.dataset.tab);document.querySelectorAll('[data-tab]').forEach(x=>x.style.color=x===b?'#fff0be':'#a79b88')});</script></html>
