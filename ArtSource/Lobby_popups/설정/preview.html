<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>설정 UI 조립 예시</title><style>html,body{margin:0;background:#0b1020;color:#edd5a7;font-family:'Malgun Gothic',sans-serif}#stage{width:1672px;height:941px;position:relative;transform-origin:top left;background:radial-gradient(ellipse at 85% 45%,#503a24 0,transparent 45%),linear-gradient(120deg,#0a1121,#222d44)}.asset{position:absolute;object-fit:contain;pointer-events:none}.logo{position:absolute;left:90px;top:190px;font-size:64px;letter-spacing:8px}.menu{position:absolute;left:145px;font-size:26px;color:#948b80}.menu.active{color:#efca80}h2{position:absolute;left:530px;width:620px;text-align:center;margin:0;font-size:32px;color:#e7c383}p{position:absolute;left:550px;width:570px;text-align:center;font-size:20px;margin:0;color:#382b22}.save-row{position:absolute;left:615px;width:480px;display:flex;align-items:center;justify-content:space-between;color:#33261e;font-size:20px}.save-row b{font-weight:500}.action{position:absolute;border:0;background:none;color:#f4dbab;font-size:22px;cursor:pointer}.action:hover{background:url('png/button_hover.png') center/contain no-repeat}.action:active{filter:brightness(.8);transform:scale(.98)}.action:focus-visible{outline:2px solid #ffe3a0}.tabs{position:absolute;left:550px;top:390px;display:flex}.tabs button{width:190px;height:65px;background:none;border:none;color:#f3d7a6;font-size:23px;cursor:pointer}.audio-row{position:absolute;left:550px;display:flex;align-items:center;gap:25px;height:45px;font-size:23px}.audio-row span{width:130px}.audio-row input{appearance:none;width:320px;height:28px;background:url('png/slider_track.png') center/100% 100%;outline:none}.audio-row input::-webkit-slider-thumb{appearance:none;width:45px;height:45px;background:url('png/slider_knob.png') center/contain no-repeat}.audio-row input::-moz-range-thumb{width:45px;height:45px;border:none;background:url('png/slider_knob.png') center/contain no-repeat}.audio-row output{width:60px}.option{position:absolute;left:565px;width:540px;display:flex;align-items:center;justify-content:space-between;font-size:23px}.option select,.key{padding:10px 20px;background:#151d33;color:#efd5a4;border:1px solid #c39650;border-radius:8px;font-size:20px}.option input{accent-color:#d6a65a;width:280px}#status{position:absolute;bottom:20px;left:520px;color:#ccbda4;font-size:18px}.note{position:absolute;left:1240px;top:650px;width:310px;color:#b9a98b;font-size:17px}</style><div id="stage"><div class="logo">악몽 수선소</div><div class="menu " style="top:410px">이어하기</div><div class="menu " style="top:476px">새로하기</div><div class="menu active" style="top:542px">설정</div><div class="menu " style="top:608px">종료</div><img class="asset " src="png/panel_settings.png" style="left:465px;top:290px;width:750px;height:530px"><img class="asset " src="png/tab_selected.png" style="left:550px;top:390px;width:178px;height:65px"><img class="asset " src="png/tab_normal.png" style="left:740px;top:390px;width:178px;height:65px"><img class="asset " src="png/tab_normal.png" style="left:930px;top:390px;width:178px;height:65px"><img class="asset " src="png/button_normal.png" style="left:545px;top:710px;width:180px;height:70px"><img class="asset " src="png/button_normal.png" style="left:740px;top:710px;width:180px;height:70px"><img class="asset " src="png/button_normal.png" style="left:935px;top:710px;width:180px;height:70px"><img class="asset " src="png/menu_marker.png" style="left:95px;top:546px;width:30px;height:30px"><img class="asset " src="png/menu_underline.png" style="left:110px;top:579px;width:265px;height:24px"><h2 style="top:330px">설정</h2><div class="tabs"><button data-tab="audio">사운드</button><button data-tab="display">화면</button><button data-tab="input">조작</button></div><div id="audio" class="tabcontent"><label class="audio-row" style="top:501px"><span>전체 음량</span><input type="range" min="0" max="100" value="80" oninput="this.nextElementSibling.textContent=this.value+'%'"><output>80%</output></label><label class="audio-row" style="top:573px"><span>배경음</span><input type="range" min="0" max="100" value="60" oninput="this.nextElementSibling.textContent=this.value+'%'"><output>60%</output></label><label class="audio-row" style="top:645px"><span>효과음</span><input type="range" min="0" max="100" value="80" oninput="this.nextElementSibling.textContent=this.value+'%'"><output>80%</output></label></div><div id="display" class="tabcontent" hidden><label class="option" style="top:500px">화면 모드 <select><option>전체 화면</option><option>창 모드</option></select></label><label class="option" style="top:562px">해상도 <select><option>1920 × 1080</option><option>1672 × 941</option></select></label><label class="option" style="top:624px">밝기 <input type="range" value="50"></label></div><div id="input" class="tabcontent" hidden><label class="option" style="top:480px">이동<button class="key" onclick="this.textContent='키 입력 대기'">W A S D</button></label><label class="option" style="top:528px">상호작용<button class="key" onclick="this.textContent='키 입력 대기'">E</button></label><label class="option" style="top:576px">타워 건설<button class="key" onclick="this.textContent='키 입력 대기'">1–5</button></label><label class="option" style="top:624px">도하 스킬<button class="key" onclick="this.textContent='키 입력 대기'">Q</button></label></div><button class="action" style="left:545px;top:710px;width:180px;height:70px" onclick="document.getElementById('status').textContent='적용 버튼 선택 예시'">적용</button><button class="action" style="left:740px;top:710px;width:180px;height:70px" onclick="document.getElementById('status').textContent='취소 버튼 선택 예시'">취소</button><button class="action" style="left:935px;top:710px;width:180px;height:70px" onclick="document.getElementById('status').textContent='기본값 버튼 선택 예시'">기본값</button><div class="note">리소스 조립 예시<br>기존 수선소 배경은 게임에서 연결<br>문자와 숫자는 별도 UI 텍스트</div><div id="status"></div></div><script>function fit(){document.getElementById('stage').style.transform='scale('+Math.min(innerWidth/1672,innerHeight/941)+')'}addEventListener('resize',fit);fit();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabcontent').forEach(e=>e.hidden=e.id!==b.dataset.tab);document.querySelectorAll('[data-tab]').forEach(x=>x.style.color=x===b?'#fff0be':'#a79b88')});</script></html>
